# Reverse proxy for CloudPulse: one public entry point on port 80.
#   /api/...  -> FastAPI backend  (127.0.0.1:8000)
#   /...      -> Next.js frontend (127.0.0.1:3000)

upstream cloudpulse_backend {
    server 127.0.0.1:8000;
}

upstream cloudpulse_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Pass the original request details to the apps behind the proxy.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://cloudpulse_backend;
    }

    location = /health {
        proxy_pass http://cloudpulse_backend;
    }

    location = /ready {
        proxy_pass http://cloudpulse_backend;
    }

    location / {
        proxy_pass http://cloudpulse_frontend;
    }
}
